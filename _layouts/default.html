<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="header-main">
          <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>
            <a href="{{ '/publications/' | relative_url }}" {% if page.url == "/publications/" %}aria-current="page"{% endif %}>Publications</a>
            <a href="{{ '/blog/' | relative_url }}" {% if page.url == "/blog/" %}aria-current="page"{% endif %}>Blog</a>
          </nav>
        </div>
      </header>

      <main class="content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>
          Design inspiration: <a href="https://kgenin.github.io/index.html">Konstantin Genin's minimalist academic homepage</a>.
          Content and implementation on this site are original and were not copied.
        </p>
        <p>
          Built with Jekyll. Structure informed by the official
          <a href="https://jekyllrb.com/docs/rendering-process/">Jekyll rendering process documentation</a>.
        </p>
      </footer>
    </div>
  </body>
</html>
